name: "Any branch: Lint codebase"

on:
  workflow_dispatch:

jobs:
  build:
    name: Lint codebase
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: github/super-linter:slim-v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: kiwi
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
