# Build Kiwi Browser APK for arm64 (armv8) only
# Triggered automatically on every push to the kiwi branch,
# or manually via "Run workflow".
name: 'Build APK arm64 (armv8)'

on:
  workflow_dispatch:
  push:
    branches:
      - kiwi

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 6-hour hard limit

    steps:
      # ----------------------------------------------------------------
      # 1. Free disk space  (GitHub runners ship with lots of junk)
      # ----------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo swapoff -av || true
          sudo rm -f /swapfile
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/lib/jvm/temurin-17-jdk-amd64/jmods
          sudo apt-get clean -y
          sudo docker system prune -af 2>/dev/null || true
          df -h

      # ----------------------------------------------------------------
      # 2. Extra swap – Chromium build links are RAM-hungry
      # ----------------------------------------------------------------
      - name: Create 8 GB swap
        run: |
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      # ----------------------------------------------------------------
      # 3. System build dependencies
      # ----------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget \
            python3 python3-pip \
            lsb-release sudo file xz-utils \
            ccache openjdk-11-jdk-headless \
            libncurses5 libtinfo5 \
            pkg-config zip unzip bzip2 \
            lzma lib32z1 lib32stdc++6 libstdc++6

      # ----------------------------------------------------------------
      # 4. ccache – dramatically speeds up rebuilds
      # ----------------------------------------------------------------
      - name: Configure ccache
        run: |
          ccache --max-size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-arm64-${{ github.sha }}
          restore-keys: |
            ccache-arm64-

      # ----------------------------------------------------------------
      # 5. Fetch depot_tools
      # ----------------------------------------------------------------
      - name: Fetch depot_tools
        run: |
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> "$GITHUB_PATH"

      # ----------------------------------------------------------------
      # 6. Checkout this Kiwi fork (Kiwi patches only)
      # ----------------------------------------------------------------
      - name: Checkout Kiwi fork
        uses: actions/checkout@v4
        with:
          path: kiwi_patches

      # ----------------------------------------------------------------
      # 7. Read versions
      # ----------------------------------------------------------------
      - name: Read Chromium version
        id: version
        run: |
          source "$GITHUB_WORKSPACE/kiwi_patches/CHROMIUM_VERSION"
          VERSION="${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          echo "chromium=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chromium: ${VERSION}"
          source "$GITHUB_WORKSPACE/kiwi_patches/KIWI_VERSION"
          KIWI_VER="${MAJOR}.${MINOR}.${BUILD}.${PATCH}"
          echo "kiwi=${KIWI_VER}" >> "$GITHUB_OUTPUT"
          echo "Kiwi: ${KIWI_VER}"

      # ----------------------------------------------------------------
      # 8. Set up gclient config and sync full Chromium source
      #    We create .gclient manually for a pinned version, then sync.
      # ----------------------------------------------------------------
      - name: Create gclient config
        run: |
          mkdir -p /home/runner/chromium
          cat > /home/runner/chromium/.gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "name": "src",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_android_native_support": True,
              },
            },
          ]
          target_os = ["android"]
          GCLIENT_EOF

      - name: Fetch Chromium src at pinned version (shallow, no history)
        run: |
          cd /home/runner/chromium
          export PATH="/home/runner/depot_tools:$PATH"
          # Clone the source at the specific Chromium version tag.
          # --nohooks: skip hook execution (we do it later after patching)
          # --no-history: shallow clone to save time and disk
          gclient sync \
            --nohooks \
            --no-history \
            -r src@${{ steps.version.outputs.chromium }} \
            --jobs 16 \
            2>&1 | tail -40
          df -h

      # ----------------------------------------------------------------
      # 9. Apply Kiwi patches on top of Chromium source
      # ----------------------------------------------------------------
      - name: Apply Kiwi patches
        run: |
          KIWI="$GITHUB_WORKSPACE/kiwi_patches"
          CSRC="/home/runner/chromium/src"
          PATCHED_DIRS="apps base chrome components content extensions net remoting services third_party toolbox ui"
          for dir in $PATCHED_DIRS; do
            if [ -d "$KIWI/$dir" ]; then
              echo "-> Patching: $dir"
              cp -rf "$KIWI/$dir/." "$CSRC/$dir/"
            fi
          done
          # Kiwi Browser enables desktop WebUI features on Android. Chrome's
          # resource .gni files (chrome_paks.gni) unconditionally pull in some
          # desktop-only resource directories (downloads, webui_gallery,
          # discards, etc.) that each carry an assert(!is_android) or
          # assert(!is_android && !is_ios) guard. Walking the full tree removes
          # them all so gn gen can evaluate those files for Android.
          python3 - << 'PYEOF'
          import os, re
          # Match any assert(...) that contains !is_android, including combined forms
          # like assert(!is_android && !is_ios) or assert(!is_ios && !is_android).
          ASSERT_RE = re.compile(
              r'^[ \t]*assert\([^)\n]*!is_android[^)\n]*\)[^\n]*\n',
              re.MULTILINE,
          )
          count = 0
          for root, dirs, files in os.walk('/home/runner/chromium/src'):
              dirs[:] = [d for d in dirs if d not in ['.git', 'out']]
              for fname in files:
                  if fname == 'BUILD.gn':
                      path = os.path.join(root, fname)
                      try:
                          with open(path) as f:
                              content = f.read()
                          if '!is_android' in content:
                              nc = ASSERT_RE.sub('', content)
                              if nc != content:
                                  with open(path, 'w') as f:
                                      f.write(nc)
                                  count += 1
                      except Exception:
                          pass
          print(f"Removed !is_android assertions from {count} BUILD.gn files")
          PYEOF

          # Root //BUILD.gn's gn_all group requires //extensions:extensions_browsertests,
          # //extensions:extensions_unittests and //extensions/shell:app_shell_unittests
          # whenever enable_extensions=true, with no is_android exception -- because in
          # stock Chromium enable_extensions is always false on Android. Kiwi/Eterna force
          # it on for Android, but extensions/BUILD.gn deliberately excludes the pak/shell
          # test targets those depend on for is_android (they were never meant to build
          # there). Exclude them from gn_all on Android too, matching extensions/BUILD.gn's
          # own guard, instead of trying to make untested test-only targets buildable.
          python3 - << 'PYEOF'
          path = '/home/runner/chromium/src/BUILD.gn'
          with open(path) as f:
              content = f.read()
          marker = '"//extensions:extensions_browsertests"'
          if marker not in content:
              raise SystemExit("extensions_browsertests reference not found in root BUILD.gn -- Chromium version may have changed this block's shape.")
          idx = content.index(marker)
          if_marker = 'if (enable_extensions) {'
          if_idx = content.rfind(if_marker, 0, idx)
          if if_idx == -1 or idx - if_idx > 300:
              raise SystemExit("Could not find enclosing 'if (enable_extensions)' block near extensions_browsertests in root BUILD.gn.")
          close_idx = content.index('\n  }', idx)
          extra = '\n  } else if (enable_extensions) {\n    deps += [\n      "//extensions/browser/api/declarative_net_request/filter_list_converter",\n    ]'
          content = (
              content[:if_idx]
              + 'if (enable_extensions && !is_android) {'
              + content[if_idx + len(if_marker):close_idx]
              + extra
              + content[close_idx:]
          )
          app_shell_marker = 'deps += [ "//extensions/shell:app_shell" ]'
          if app_shell_marker not in content:
              raise SystemExit("app_shell reference not found in root BUILD.gn -- Chromium version may have changed this block's shape.")
          app_shell_idx = content.index(app_shell_marker)
          second_if_idx = content.rfind(if_marker, 0, app_shell_idx)
          if second_if_idx == -1 or app_shell_idx - second_if_idx > 60:
              raise SystemExit("Could not find enclosing 'if (enable_extensions)' block near app_shell in root BUILD.gn.")
          content = (
              content[:second_if_idx]
              + 'if (enable_extensions && !is_android) {'
              + content[second_if_idx + len(if_marker):]
          )
          with open(path, 'w') as f:
              f.write(content)
          print("Patched gn_all: excluded extensions test-only targets from Android")
          PYEOF

          # Root BUILD.gn's gn_all group includes //chrome/test:unit_tests in
          # the if (!is_ios) block with no Android guard. On Android this causes
          # unit_tests__apk to be evaluated, which transitively requires
          # extensions:extensions_resources to have an Android APK build config —
          # a config that the Android toolchain cannot generate for that group.
          # Fix: add chrome/test:unit_tests to the existing deps -= list in the
          # if (is_android) block (alongside net_perftests / url_unittests).
          python3 - << 'PYEOF'
          path = '/home/runner/chromium/src/BUILD.gn'
          with open(path) as f:
              content = f.read()
          android_minus = '    deps -= [\n      "//net:net_perftests",'
          if android_minus not in content:
              raise SystemExit("Could not find 'deps -= //net:net_perftests' in Android block of root BUILD.gn.")
          content = content.replace(
              android_minus,
              '    deps -= [\n      "//chrome/test:unit_tests",\n      "//net:net_perftests",',
              1,
          )
          with open(path, 'w') as f:
              f.write(content)
          print("Patched gn_all: removed chrome/test:unit_tests from Android deps")
          PYEOF
          echo "All Kiwi patches applied."

      # ----------------------------------------------------------------
      # 10. Run gclient hooks (installs Android NDK / SDK, clang, etc.)
      # ----------------------------------------------------------------
      - name: Run gclient hooks
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          gclient runhooks --jobs 16 2>&1 | tail -20

      # ----------------------------------------------------------------
      # 11. Install Android-specific system dependencies
      # ----------------------------------------------------------------
      - name: Install Android build deps
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          yes | ./build/install-build-deps-android.sh 2>&1 | tail -20

      # ----------------------------------------------------------------
      # 12. Generate signing keystore
      # ----------------------------------------------------------------
      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore /home/runner/chromium/src/keystore.jks \
            -alias dev \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass public_password \
            -keypass public_password \
            -dname "cn=Kiwi Browser Fork, ou=GitHub Actions, o=${{ github.repository_owner }}, c=CA"

      # ----------------------------------------------------------------
      # 13. Prepare args.gn for arm64
      # ----------------------------------------------------------------
      - name: Prepare args.gn
        run: |
          mkdir -p /home/runner/chromium/src/out/android_arm64
          BUILD_DATE=$(date '+%y%m%d')
          RUN_ID="${{ github.run_id }}"
          # Inject dynamic version strings into the reference args.gn
          sed \
            -e "s|android_default_version_name = \"Git\"|android_default_version_name = \"Git${BUILD_DATE}Gen${RUN_ID}\"|" \
            -e "s|android_default_version_code = \"1\"|android_default_version_code = \"${BUILD_DATE}2\"|" \
            "$GITHUB_WORKSPACE/kiwi_patches/.build/production_build_reference/args.gn" \
            > /home/runner/chromium/src/out/android_arm64/args.gn
          echo "=== args.gn ==="
          cat /home/runner/chromium/src/out/android_arm64/args.gn

      # ----------------------------------------------------------------
      # 14. GN gen – generate Ninja build files
      # ----------------------------------------------------------------
      - name: gn gen
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          gn gen out/android_arm64 --root-target=//chrome/android:chrome_public_apk 2>&1

      # ----------------------------------------------------------------
      # 15. Build  (arm64 only – autoninja auto-limits parallelism)
      # ----------------------------------------------------------------
      - name: Build chrome_public_apk (arm64)
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          export CCACHE_DIR="/home/runner/.ccache"
          autoninja -C out/android_arm64 chrome_public_apk 2>&1
          echo "=== Build complete ==="
          ls -lh out/android_arm64/apks/

      - name: Show ccache stats
        run: ccache --show-stats

      # ----------------------------------------------------------------
      # 16. Rename APK with version metadata
      # ----------------------------------------------------------------
      - name: Rename APK
        run: |
          APKS_DIR=/home/runner/chromium/src/out/android_arm64/apks
          BUILD_DATE=$(date '+%y%m%d')
          FINAL_NAME="kiwi-arm64-${BUILD_DATE}-run${{ github.run_id }}.apk"
          cp "$APKS_DIR/ChromePublic.apk" "$APKS_DIR/$FINAL_NAME"
          echo "APK_PATH=$APKS_DIR/$FINAL_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$FINAL_NAME" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------
      # 17. Upload APK as GitHub Actions artifact (always, even on error)
      # ----------------------------------------------------------------
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-arm64-${{ github.run_id }}
          path: /home/runner/chromium/src/out/android_arm64/apks/ChromePublic.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------------
      # 18. Create GitHub Release with the APK
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Kiwi arm64 – ${{ steps.version.outputs.kiwi }} (build ${{ github.run_id }})"
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## Kiwi Browser – arm64 (armv8)

            | | |
            |---|---|
            | **Chromium base** | ${{ steps.version.outputs.chromium }} |
            | **Kiwi version** | ${{ steps.version.outputs.kiwi }} |
            | **Architecture** | arm64 (armv8) |
            | **Build ID** | ${{ github.run_id }} |
            | **Commit** | ${{ github.sha }} |

            ### Installing
            Download the `.apk` file and install it on your Android device.
            Allow installation from unknown sources if prompted.

            ### Tab Session Isolation
            This build includes the **Tab Session Isolation** feature:
            - Open multiple accounts on the same site simultaneously
            - Each isolated tab has completely separate cookies, localStorage,
              IndexedDB, cache, and service workers
          files: /home/runner/chromium/src/out/android_arm64/apks/ChromePublic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
