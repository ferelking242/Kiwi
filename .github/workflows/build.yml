name: Eterna Browser — Build

on:
  push:
    branches: [ kiwi, main, dev ]
  pull_request:
    branches: [ kiwi, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Create swap
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch Kiwi Browser source (shallow)
        run: |
          gclient config --name src --unmanaged https://github.com/ferelking242/eterna-browser.git
          gclient sync --nohooks --no-history --shallow -D --force -r kiwi
        env:
          DEPOT_TOOLS_UPDATE: 0

      - name: Run gclient hooks
        run: gclient runhooks
        env:
          DEPOT_TOOLS_UPDATE: 0

      - name: Install Android build deps
        run: |
          cd src
          sudo ./build/install-build-deps-android.py --no-prompt 2>/dev/null || true
          sudo ./build/install-build-deps.py --no-prompt --no-syms 2>/dev/null || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ETERNA_KEYSTORE_BASE64 }}" | base64 -d > /tmp/eterna.keystore

      - name: Generate build files (arm64-v8a)
        run: |
          cd src
          mkdir -p out/eterna_arm64
          cat > out/eterna_arm64/args.gn << 'ARGSEOF'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_official_build = true
          is_component_build = false
          enable_nacl = false
          enable_chrome_apps = false
          chrome_pgo_phase = 0
          android_channel = "stable"
          android_default_version_name = "1.0.0"
          android_default_version_code = "1000000"
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          fieldtrial_testing_like_official_build = true
          ARGSEOF
          gn gen out/eterna_arm64

      - name: Build Eterna Browser APK
        run: |
          cd src
          autoninja -C out/eterna_arm64 chrome_public_apk

      - name: Sign APK
        run: |
          cd src/out/eterna_arm64/apks
          jarsigner -verbose \
            -keystore /tmp/eterna.keystore \
            -storepass "${{ secrets.ETERNA_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ETERNA_KEY_PASSWORD }}" \
            ChromePublic.apk "${{ secrets.ETERNA_KEY_ALIAS }}"
          zipalign -v 4 ChromePublic.apk EternaBrowser-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eterna-browser-arm64-v8a
          path: src/out/eterna_arm64/apks/EternaBrowser-arm64-v8a.apk
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/out/eterna_arm64/apks/EternaBrowser-arm64-v8a.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
