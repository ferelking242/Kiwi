name: Eterna Browser — Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo swapoff -av || true
          sudo rm -f /swapfile
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/boost
          sudo apt-get clean -y
          df -h

      - name: Create 8 GB swap
        run: |
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget \
            python3 python3-pip \
            lsb-release sudo file xz-utils \
            ccache openjdk-11-jdk-headless \
            libncurses5 libtinfo5 \
            pkg-config zip unzip bzip2 \
            lzma lib32z1 lib32stdc++6 libstdc++6

      - name: Fetch depot_tools
        run: |
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            /home/runner/depot_tools
          echo "/home/runner/depot_tools" >> "$GITHUB_PATH"

      - name: Checkout Eterna Browser patches
        uses: actions/checkout@v4
        with:
          path: eterna_patches

      - name: Read Chromium version
        id: version
        run: |
          source "$GITHUB_WORKSPACE/eterna_patches/CHROMIUM_VERSION"
          VERSION="${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          echo "chromium=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chromium: ${VERSION}"
          source "$GITHUB_WORKSPACE/eterna_patches/KIWI_VERSION"
          KIWI_VER="${MAJOR}.${MINOR}.${BUILD}.${PATCH}"
          echo "kiwi=${KIWI_VER}" >> "$GITHUB_OUTPUT"
          echo "Kiwi: ${KIWI_VER}"

      - name: Create gclient config
        run: |
          mkdir -p /home/runner/chromium
          cat > /home/runner/chromium/.gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "name": "src",
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
                "checkout_android_native_support": True,
              },
            },
          ]
          target_os = ["android"]
          GCLIENT_EOF

      - name: Fetch Chromium src at pinned version
        run: |
          set -euo pipefail
          cd /home/runner/chromium
          export PATH="/home/runner/depot_tools:$PATH"
          gclient sync \
            --nohooks \
            --no-history \
            -r src@${{ steps.version.outputs.chromium }} \
            --jobs 16
          df -h

      - name: Apply Eterna patches
        run: |
          ETERNA="$GITHUB_WORKSPACE/eterna_patches"
          CSRC="/home/runner/chromium/src"
          PATCHED_DIRS="apps base chrome components content extensions net remoting services third_party toolbox ui"
          for dir in $PATCHED_DIRS; do
            if [ -d "$ETERNA/$dir" ]; then
              echo "-> Patching: $dir"
              cp -rf "$ETERNA/$dir/." "$CSRC/$dir/"
            fi
          done
          # Eterna enables desktop WebUI features on Android. Chrome's resource
          # .gni files (chrome_paks.gni) unconditionally pull in some
          # desktop-only resource directories (downloads, webui_gallery,
          # discards, etc.) that each carry an assert(!is_android) or
          # assert(!is_android && !is_ios) guard. Walking the full tree removes
          # them all so gn gen can evaluate those files for Android.
          python3 - << 'PYEOF'
          import os, re
          ASSERT_RE = re.compile(
              r'^[ \t]*assert\([^)\n]*!is_android[^)\n]*\)[^\n]*\n',
              re.MULTILINE,
          )
          count = 0
          for root, dirs, files in os.walk('/home/runner/chromium/src'):
              dirs[:] = [d for d in dirs if d not in ['.git', 'out']]
              for fname in files:
                  if fname == 'BUILD.gn':
                      path = os.path.join(root, fname)
                      try:
                          with open(path) as f:
                              content = f.read()
                          if '!is_android' in content:
                              nc = ASSERT_RE.sub('', content)
                              if nc != content:
                                  with open(path, 'w') as f:
                                      f.write(nc)
                                  count += 1
                      except Exception:
                          pass
          print(f"Removed !is_android assertions from {count} BUILD.gn files")
          PYEOF

          # Root //BUILD.gn's gn_all group requires //extensions:extensions_browsertests,
          # //extensions:extensions_unittests and //extensions/shell:app_shell_unittests
          # whenever enable_extensions=true, with no is_android exception -- because in
          # stock Chromium enable_extensions is always false on Android. Kiwi/Eterna force
          # it on for Android, but extensions/BUILD.gn deliberately excludes the pak/shell
          # test targets those depend on for is_android (they were never meant to build
          # there). Exclude them from gn_all on Android too, matching extensions/BUILD.gn's
          # own guard, instead of trying to make untested test-only targets buildable.
          python3 - << 'PYEOF'
          path = '/home/runner/chromium/src/BUILD.gn'
          with open(path) as f:
              content = f.read()
          old = '''  if (enable_extensions) {
    deps += [
      "//extensions:extensions_browsertests",
      "//extensions:extensions_unittests",
      "//extensions/browser/api/declarative_net_request/filter_list_converter",
      "//extensions/shell:app_shell_unittests",
    ]
  }'''
          new = '''  if (enable_extensions && !is_android) {
    deps += [
      "//extensions:extensions_browsertests",
      "//extensions:extensions_unittests",
      "//extensions/browser/api/declarative_net_request/filter_list_converter",
      "//extensions/shell:app_shell_unittests",
    ]
  } else if (enable_extensions) {
    deps += [
      "//extensions/browser/api/declarative_net_request/filter_list_converter",
    ]
  }'''
          if old not in content:
              raise SystemExit("Could not find expected gn_all enable_extensions block in root BUILD.gn -- Chromium version may have changed this block's shape.")
          with open(path, 'w') as f:
              f.write(content.replace(old, new, 1))
          print("Patched gn_all: excluded extensions test-only targets from Android")
          PYEOF
          echo "All Eterna patches applied."

      - name: Run gclient hooks
        run: |
          set -euo pipefail
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          gclient runhooks --jobs 16

      - name: Install Android build deps
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          yes | ./build/install-build-deps-android.sh || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ETERNA_KEYSTORE_BASE64 }}" | base64 -d > /tmp/eterna.keystore

      - name: Prepare args.gn
        run: |
          mkdir -p /home/runner/chromium/src/out/eterna_arm64
          BUILD_DATE=$(date '+%y%m%d')
          RUN_ID="${{ github.run_id }}"
          cat > /home/runner/chromium/src/out/eterna_arm64/args.gn << ARGSEOF
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_official_build = true
          is_component_build = false
          enable_nacl = false
          enable_chrome_apps = false
          chrome_pgo_phase = 0
          android_channel = "stable"
          android_default_version_name = "Eterna-${BUILD_DATE}-${RUN_ID}"
          android_default_version_code = "${BUILD_DATE}2"
          ffmpeg_branding = "Chrome"
          proprietary_codecs = true
          fieldtrial_testing_like_official_build = true
          ARGSEOF
          echo "=== args.gn ==="
          cat /home/runner/chromium/src/out/eterna_arm64/args.gn

      - name: gn gen
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          gn gen out/eterna_arm64 2>&1

      - name: Build chrome_public_apk (arm64)
        run: |
          cd /home/runner/chromium/src
          export PATH="/home/runner/depot_tools:$PATH"
          autoninja -C out/eterna_arm64 chrome_public_apk 2>&1
          echo "=== Build complete ==="
          ls -lh out/eterna_arm64/apks/

      - name: Align and sign APK
        run: |
          set -euo pipefail
          APKS_DIR=/home/runner/chromium/src/out/eterna_arm64/apks
          # Correct order: align first, then sign (signing after align invalidates alignment)
          zipalign -v 4 \
            "${APKS_DIR}/ChromePublic.apk" \
            "${APKS_DIR}/EternaBrowser-arm64-v8a-unsigned.apk"
          # Use apksigner (part of Android build-tools) for v2/v3 signature scheme
          APKSIGNER=$(find /home/runner/chromium/src/third_party/android_sdk \
            -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find ~/.android/sdk /opt -name apksigner -type f 2>/dev/null | head -1 || true)
          fi
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" sign \
              --ks /tmp/eterna.keystore \
              --ks-pass "pass:${{ secrets.ETERNA_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ETERNA_KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ETERNA_KEY_ALIAS }}" \
              --out "${APKS_DIR}/EternaBrowser-arm64-v8a.apk" \
              "${APKS_DIR}/EternaBrowser-arm64-v8a-unsigned.apk"
          else
            # Fall back to jarsigner if apksigner unavailable
            cp "${APKS_DIR}/EternaBrowser-arm64-v8a-unsigned.apk" \
               "${APKS_DIR}/EternaBrowser-arm64-v8a.apk"
            jarsigner -verbose \
              -keystore /tmp/eterna.keystore \
              -storepass "${{ secrets.ETERNA_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.ETERNA_KEY_PASSWORD }}" \
              "${APKS_DIR}/EternaBrowser-arm64-v8a.apk" \
              "${{ secrets.ETERNA_KEY_ALIAS }}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eterna-browser-arm64-v8a-${{ github.run_id }}
          path: /home/runner/chromium/src/out/eterna_arm64/apks/EternaBrowser-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eterna-mapping-files-${{ github.run_id }}
          path: /home/runner/chromium/src/out/eterna_arm64/lib.unstripped/
          retention-days: 30
